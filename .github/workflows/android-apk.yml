# Builds the TF Music Android app (APK) on GitHub's servers.
# Runs by itself whenever the app (index.html) or the android-app folder changes,
# or by hand from the Actions tab ("Run workflow").
# The finished APK is put on the repository's Releases page (tag: android-latest):
#   https://github.com/taiful666/tfmusic/releases/download/android-latest/TF-Music.apk
# The website (GitHub Pages) is not affected by this.
name: Build Android app (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app tools
        run: npm install --no-audit --no-fund

      - name: Copy the web app into the Android project (with the app design)
        run: node prepare-www.mjs

      - name: Create the Android project
        run: npx cap add android

      - name: Make icons and splash screen from the logo
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0E0F14' --iconBackgroundColorDark '#0E0F14' --splashBackgroundColor '#0A0B0F' --splashBackgroundColorDark '#0A0B0F'

      - name: Microphone, storage and portrait screen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' "$M"
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' "$M"
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' "$M"
          grep -q RECORD_AUDIO "$M" && grep -q screenOrientation "$M"
          cat "$M"

      - name: Set version number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Sync plugins
        run: npx cap sync android

      - name: Signing key (secret TFMUSIC_KEYSTORE_B64 = the permanent key, so updates install over the old app)
        env:
          KS: ${{ secrets.TFMUSIC_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.TFMUSIC_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.TFMUSIC_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::No permanent signing key yet (secret TFMUSIC_KEYSTORE_B64). This APK uses a temporary test key."
            echo "TEMP_KEY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          KSF="$GITHUB_WORKSPACE/android-app/android/app/tf-music.keystore"
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$KSF"
          export KS_PASS="${KS_PASS:-android}" KS_ALIAS="${KS_ALIAS:-androiddebugkey}"
          keytool -list -keystore "$KSF" -storepass "$KS_PASS" -alias "$KS_ALIAS" > /dev/null
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  tfmusic {
                      storeFile file('tf-music.keystore')
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KS_ALIAS')
                      keyPassword System.getenv('KS_PASS')
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.tfmusic }
                  debug { signingConfig signingConfigs.tfmusic }
              }
          }
          GRADLE
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          keytool -exportcert -keystore "$KSF" -storepass "$KS_PASS" -alias "$KS_ALIAS" | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/key.sha256"
          echo "Permanent signing key in use"

      - name: Build the APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          if [ "$TEMP_KEY" = "1" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TF-Music.apk"
            ls -la "$GITHUB_WORKSPACE/TF-Music.apk"; exit 0
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/TF-Music.apk"
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          GOT=$("$SIGNER" verify --print-certs "$GITHUB_WORKSPACE/TF-Music.apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          WANT=$(cat "$RUNNER_TEMP/key.sha256")
          echo "APK key: $GOT"
          if [ "$GOT" != "$WANT" ]; then echo "::error::APK is not signed with the fixed key"; exit 1; fi
          ls -la "$GITHUB_WORKSPACE/TF-Music.apk"

      - name: Keep the APK as a build file
        uses: actions/upload-artifact@v4
        with:
          name: TF-Music-apk
          path: TF-Music.apk

      - name: Publish the APK on the Releases page
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest TF-Music.apk \
            --target "${{ github.sha }}" \
            --title "TF Music — Android app (build ${{ github.run_number }})" \
            --notes "ফোনে ইনস্টল করতে TF-Music.apk ফাইলটি ডাউনলোড করে খুলুন। (Build ${{ github.run_number }})"
